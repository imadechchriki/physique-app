<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation de changement de mot de passe</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #28a745; color: white; padding: 20px; text-align: center; }
        .content { padding: 30px; background: #f8f9fa; }
        .footer { padding: 20px; text-align: center; font-size: 12px; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Physics API</h1>
    </div>
    <div class="content">
        <h2>Mot de passe modifié avec succès</h2>
        <p>Bonjour <span th:text="${userName}">User</span>,</p>
        <p>Votre mot de passe a été modifié avec succès. Si vous n'êtes pas à l'origine de cette modification, contactez-nous immédiatement.</p>
        <p>Cordialement,<br>L'équipe Physics API</p>
    </div>
    <div class="footer">
        <p>Cet e-mail a été envoyé automatiquement, merci de ne pas y répondre.</p>
    </div>
</div>
</body>
</html>

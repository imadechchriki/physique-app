# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# Application Name
spring.application.name=physics-api

# PostgreSQL Database Configuration - Standard Spring Boot way
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:physics_db}?sslmode=disable
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JPA Configuration
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Logging
logging.level.com.imad.physics_api=${LOG_LEVEL:DEBUG}
logging.level.org.springframework.web=INFO




# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.packages-to-scan=com.imad.physics_api.controller
# API Documentation
api.version=1.0.0
api.title=Physics API
api.description=A comprehensive API for physics calculations and simulations


# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Admin User Configuration
app.admin.email=${ADMIN_EMAIL:admin@physics-api.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.firstName=${ADMIN_FIRST_NAME:Physics}
app.admin.lastName=${ADMIN_LAST_NAME:Admin}

# JPA Auditing
spring.jpa.hibernate.enable_lazy_load_no_trans=false
spring.data.jpa.repositories.bootstrap-mode=default

# Enable JPA Auditing
spring.jpa.properties.hibernate.listeners.envers.autoRegisterListeners=false

# Jackson configuration for LocalDateTime
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-durations-as-timestamps=false

# Email Configuration
spring.mail.host=${SMTP_SERVER:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_ENABLE_SSL:true}
spring.mail.properties.mail.smtp.starttls.required=true

# Email Settings
app.mail.sender=${EMAIL_SENDER}
app.mail.sender-name=${EMAIL_SENDER_NAME:Physics API}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.password-reset.token-expiry=${PASSWORD_RESET_TOKEN_EXPIRY:3600000}

# Configuration Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false







# Logging for debugging
logging.level.com.imad.physics_api.service.FileUploadService=DEBUG

# Ajouter ces configurations � votre application.properties existant

# Configuration du stockage des images
app.upload.images.dir=uploads/images
app.upload.images.courses.dir=uploads/images/courses
app.upload.images.exams.dir=uploads/images/exams
app.upload.images.max-size=5242880

# Configuration LaTeX
app.latex.max-content-size=10485760
app.latex.enable-cache=true
app.latex.cache-duration=3600

# Configuration des cours
app.courses.max-sections=100
app.courses.max-images=50
app.courses.default-reading-speed=200

# Configuration des examens
app.exams.max-sections=50
app.exams.max-images=30
app.exams.enable-solutions=true

# S�curit� des images
app.security.images.allowed-extensions=jpg,jpeg,png,gif,svg,webp
app.security.images.validate-content=true
app.security.images.max-upload-size=5MB

# Cache configuration
spring.cache.type=simple
spring.cache.cache-names=courses,exams,images
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# Pagination par d�faut
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# Configuration multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# Configuration des t�ches asynchrones
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-

# Monitoring des performances
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.enabled=true

